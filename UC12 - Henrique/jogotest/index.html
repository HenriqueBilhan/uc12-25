<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏚️ MANSÃO ASSOMBRADA 🏚️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: none;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #111 0%, #000 100%);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ff0000;
            font-size: 18px;
            text-shadow: 0 0 10px #ff0000;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ff0000;
        }
        #message {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,0,0,0.9);
            color: #fff;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 20px;
            border: 3px solid #ff0000;
            display: none;
            animation: pulse 0.3s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            font-size: 16px;
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            color: #ff0000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            text-align: center;
            z-index: 100;
        }
        #gameOver button {
            margin-top: 30px;
            padding: 20px 40px;
            font-size: 24px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        🩸 Vida: <span id="health">100</span> | 
        😱 Medo: <span id="fear">0</span> | 
        💎 Gemas: <span id="gems">0</span>/3
    </div>
    
    <div id="message"></div>
    <div id="controls">
        WASD/Setas = Mover<br>
        ESPAÇO = Correr | E = Interagir<br>
        R = Reiniciar
    </div>
    
    <div id="gameOver">
        <h1>💀 VOCÊ MORREU 💀</h1>
        <p id="finalStats"></p>
        <button onclick="game.restart()">🔄 RECOMEÇAR</button>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
